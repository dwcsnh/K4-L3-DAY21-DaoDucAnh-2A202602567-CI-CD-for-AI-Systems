name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        # TODO 1: Viet lenh de chay pytest tren thu muc tests/ voi co -v
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python - <<'PYEOF'
          import json, os, sys

          raw = os.environ.get("STORAGE_CREDENTIALS", "").strip()
          if not raw:
              print("::error::Secret STORAGE_CREDENTIALS is empty or not found! Please check GitHub Secrets.", file=sys.stderr)
              sys.exit(1)

          # Kiem tra neu la GCP JSON (co chua private_key)
          try:
              data = json.loads(raw)
              if isinstance(data, dict) and "private_key" in data:
                  with open("/tmp/sa-key.json", "w") as f:
                      json.dump(data, f)
                  with open(os.environ["GITHUB_ENV"], "a") as env_file:
                      env_file.write("GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json\n")
                  print("Authenticated with GCP Service Account.")
                  sys.exit(0)
          except Exception:
              pass

          # Xu ly AWS credentials (ho tro ca dinh dang JSON, key=val, INI, hoac export)
          key_id, secret, region = None, None, "us-east-1"

          # 1. Thu parse dang JSON
          try:
              data = json.loads(raw)
              if isinstance(data, dict):
                  key_id = data.get("aws_access_key_id") or data.get("AWS_ACCESS_KEY_ID") or data.get("access_key")
                  secret = data.get("aws_secret_access_key") or data.get("AWS_SECRET_ACCESS_KEY") or data.get("secret_key")
                  region = data.get("aws_region") or data.get("AWS_DEFAULT_REGION") or data.get("region") or "us-east-1"
          except Exception:
              pass

          # 2. Neu khong phai JSON, parse theo tung dong (key=val hoac INI)
          if not (key_id and secret):
              for line in raw.splitlines():
                  line = line.strip().replace("export ", "")
                  if "=" in line:
                      k, v = line.split("=", 1)
                      k = k.strip().upper()
                      v = v.strip().strip("\"'")
                      if "ACCESS_KEY_ID" in k or k == "AWS_ACCESS_KEY":
                          key_id = v
                      elif "SECRET_ACCESS_KEY" in k or k == "AWS_SECRET_KEY":
                          secret = v
                      elif "REGION" in k:
                          region = v

          if key_id and secret:
              # Ghi vao ~/.aws/credentials va ~/.aws/config cho AWS CLI, DVC (s3fs), boto3
              aws_dir = os.path.expanduser("~/.aws")
              os.makedirs(aws_dir, exist_ok=True)
              with open(os.path.join(aws_dir, "credentials"), "w") as f:
                  f.write(f"[default]\naws_access_key_id = {key_id}\naws_secret_access_key = {secret}\n")
              with open(os.path.join(aws_dir, "config"), "w") as f:
                  f.write(f"[default]\nregion = {region}\noutput = json\n")

              # Export vao GITHUB_ENV
              with open(os.environ["GITHUB_ENV"], "a") as env_file:
                  env_file.write(f"AWS_ACCESS_KEY_ID={key_id}\n")
                  env_file.write(f"AWS_SECRET_ACCESS_KEY={secret}\n")
                  env_file.write(f"AWS_DEFAULT_REGION={region}\n")
                  env_file.write(f"AWS_REGION={region}\n")

              print(f"Authenticated with AWS credentials successfully (Region: {region}).")
          else:
              print("::error::Khong the trich xuat AWS credentials tu secret STORAGE_CREDENTIALS. Vui long kiem tra lai noi dung secret!", file=sys.stderr)
              sys.exit(1)
          PYEOF


      - name: Pull data with DVC
        # TODO 3: Pull cac file du lieu can thiet tu cloud storage bang lenh dvc pull.
        #         Chi pull train_batch1.csv va holdout.csv (khong can train_batch2.csv).
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        # TODO 4: Doc gia tri "f1_score" tu outputs/report.json bang Python inline.
        #         Set ket qua thanh output "f1" de job quality-gate co the doc.
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        # TODO 5: Su dung cloud SDK de upload models/model.joblib len
        #         <bucket>/artifacts/current/model.joblib.
        #         Ten bucket lay tu secret ARTIFACT_BUCKET.
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import os
          bucket_name = os.environ["ARTIFACT_BUCKET"]
          model_path = "models/model.joblib"
          key = "artifacts/current/model.joblib"

          if os.environ.get("GOOGLE_APPLICATION_CREDENTIALS"):
              from google.cloud import storage
              client = storage.Client()
              bucket = client.bucket(bucket_name)
              blob = bucket.blob(key)
              blob.upload_from_filename(model_path)
              print(f"Uploaded {model_path} to gs://{bucket_name}/{key}")
          else:
              import boto3
              s3 = boto3.client("s3")
              s3.upload_file(model_path, bucket_name, key)
              print(f"Uploaded {model_path} to s3://{bucket_name}/{key}")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  #
  # Luu y: nguong o day dat tren f1_score chu KHONG phai accuracy. Bo du lieu
  # Adult co ty le lop 75/25, nen mot mo hinh doan bua "thu nhap thap" cho moi
  # mau da dat accuracy 0.75 ma hoan toan vo dung.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        # TODO 6: Doc f1 tu output cua job train.
        #         Neu f1 < 0.65, ket thuc voi loi ro rang.
        #         Neu dat nguong, in thong bao va tiep tuc.
        run: |
          python - <<'PYEOF'
          f1 = float("${{ needs.train.outputs.f1 }}")
          threshold = 0.65
          print(f"F1 score danh gia: {f1:.4f} (Nguong toi thieu: {threshold})")
          if f1 < threshold:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < {threshold}. Huy trien khai.")
          print("PASSED: f1_score dat nguong chat luong. Cho phep trien khai.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Quality Gate) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # TODO 7: Restart service income-api tren VM.
            # TODO 8: Cho server san sang roi goi curl /healthz de xac nhan.
            #         Neu health check that bai sau nhieu lan thu, thoat voi exit 1.
            sudo systemctl restart income-api
            sleep 5
            curl -sf http://localhost:8080/healthz && echo "Health check passed." || exit 1
